{% extends 'base.html' %}
{% block title %}Menu{% endblock %}
{% block content %}
<h1 class="mt-3">Menu Items</h1>
<a href="{% url 'menu_create' %}" class="btn btn-primary mb-3">Add Item</a>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Item</th>
            <th>Price (R)</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr>
            <td>{{ item.item_name }}</td>
            <td>{{ item.price }}</td>
            <td>
                <a href="{% url 'menu_update' item.id %}" class="btn btn-sm btn-outline-primary">Edit</a>
                <a href="{% url 'menu_delete' item.id %}" class="btn btn-sm btn-outline-danger">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="3">No menu items.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
