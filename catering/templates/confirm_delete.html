{% extends 'base.html' %}
{% block title %}Delete Confirmation{% endblock %}
{% block content %}
<h1 class="mt-3">Delete {{ type }}</h1>
<p>Are you sure you want to delete "{{ object }}"? This action cannot be undone.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url request.META.HTTP_REFERER|default:'dashboard' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
