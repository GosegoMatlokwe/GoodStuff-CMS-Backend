{% extends 'base.html' %}
{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card border-danger">
        <div class="card-header bg-danger text-white">
            <!-- Pulls the 'type' variable passed from the view (e.g., 'booking', 'menu item') -->
            Delete {{ type }}
        </div>
        <div class="card-body">
            <!-- Warns the user that the action is permanent -->
            <h5 class="card-title text-danger">Are you sure?</h5>
            <p>Are you sure you want to delete this {{ type }}? This action cannot be undone.</p>

            <!-- Displays the name of the object being deleted (e.g., the Menu Item name) -->
            <p><strong>{{ object }}</strong></p>

            <!-- Form to actually execute the delete -->
            <form method="post">
                {% csrf_token %}
                <!-- Confirms the delete and triggers the view logic -->
                <button type="submit" class="btn btn-danger">Yes, Delete</button>
                <!-- Cancel button returns to the previous page (using the browser's history) -->
                <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
