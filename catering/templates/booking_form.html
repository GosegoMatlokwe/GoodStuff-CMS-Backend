{% extends 'base.html' %}

<!-- Uses a variable 'title' passed from the view (e.g., "Create Booking" or "Edit Booking") -->
{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1 class="mt-3">{{ title }}</h1>

<!-- Form submits data via POST to save to the database -->
<form method="post">
    <!-- CRITICAL: Django security token to prevent Cross-Site Request Forgery attacks -->
    {% csrf_token %}

    <!-- Automatically renders all fields from the BookingForm in forms.py (Customer, Event Type, Date, etc.) -->
    {{ form.as_p }}

    <!-- Submit button triggers the view to validate and save the form -->
    <button type="submit" class="btn btn-primary">Save</button>

    <!-- Cancel button goes back to the list without saving -->
    <a href="{% url 'booking_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
